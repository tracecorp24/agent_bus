[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbus"
version = "0.1.0"
description = "Agent Bus - Kalıcı SQLite tabanlı Antigravity ajan orkestratörü"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "textual>=0.80.0",
    "pyte>=0.8.2",
    "pywinpty>=2.0.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
agentbus = "agentbus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
